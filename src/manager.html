<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Archivos — ProfeRonald</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/assets/images/favicon.ico"><link rel="stylesheet" href="{{APP_CSS}}"></head>
<body><main class="container py-4"><a href="/">Volver al blog</a><h1>Gestor de archivos</h1><button type="button" id="manager-auth" class="btn btn-primary">Entrar con Google</button><p id="access-message" class="mt-3"></p><div id="app-status" role="status" aria-live="polite" hidden></div>
<section id="manager" hidden><nav class="my-3" aria-label="Carpetas"><button type="button" id="photos-folder" class="btn btn-outline-primary">Fotos públicas</button> <button type="button" id="documents-folder" class="btn btn-outline-primary">Documentos privados</button> <button type="button" id="parent-folder" class="btn btn-outline-secondary">Carpeta superior</button></nav><h2 id="folder-name">Biblioteca</h2><form id="upload-form"><label for="upload-file">Archivo (imágenes hasta 5 MB en Fotos; documentos hasta 20 MB)</label><input class="form-control-file mb-2" type="file" id="upload-file" required><button type="submit" id="upload-button" class="btn btn-primary">Subir archivo</button></form><ul id="file-list" class="list-unstyled mt-3"></ul><p id="empty-files" hidden>Esta carpeta está vacía.</p><button type="button" class="btn btn-outline-primary" id="more-files" hidden>Cargar más</button></section>
</main><script type="module" src="{{MANAGER_JS}}"></script></body></html>
