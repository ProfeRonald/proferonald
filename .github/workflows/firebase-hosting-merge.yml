name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: firebase-live
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  build_and_deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Configure deployment credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROFERONALD_FB }}'
        run: node scripts/ci-credentials.mjs
      - run: node scripts/preflight.mjs
      - run: npm run build
      - run: npm run seo
      - run: npx firebase deploy --project proferonald-fb --only database,storage,functions,hosting --non-interactive
