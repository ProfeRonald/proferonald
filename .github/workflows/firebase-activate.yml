name: Inspect and activate Firebase v2
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Inspect current state or activate after a verified backup
        type: choice
        options: [inspect, activate]
        default: inspect
permissions:
  contents: read
concurrency:
  group: firebase-live
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Configure existing Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROFERONALD_FB }}'
        run: node scripts/ci-credentials.mjs
      - name: Inspect current state without modifying Firebase
        run: node scripts/activation-inspect.mjs
      - name: Activate with verified recovery backup
        if: inputs.phase == 'activate'
        run: node scripts/activate.mjs
